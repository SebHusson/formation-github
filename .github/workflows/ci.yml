name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PHP 8.3 image
        run: |
          docker build -f .docker/Dockerfile -t project-ci:php8.3 .

      - name: Run composer install and tests inside container
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" -w /app project-ci:php8.3 bash -lc "composer install --no-interaction --prefer-dist --optimize-autoloader && composer test"

      - name: Upload PHPUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-log
          path: ./phpunit.xml

